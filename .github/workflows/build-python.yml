name: Build Python 32-bit ONLY (Final Optimized 20MB Size)
on: [push, workflow_dispatch]

jobs:
  build-32bit:
    runs-on: ubuntu-latest

    steps:
    - name: Setup System Dependencies
      run: |
        echo "⚙️ Setting up dependencies..."
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config curl git unzip default-jdk

    - name: Checkout Official CPython Source Code
      run: |
        echo "📥 Downloading CPython Source Code (STABLE 3.14)..."
        git clone --depth 1 --branch 3.14 https://github.com/python/cpython.git || git clone --depth 1 https://github.com/python/cpython.git

    - name: Compile Python ONLY for 32-bit (arm-linux-androideabi)
      run: |
        cd cpython
        
        # Script location detect karna
        if [ -d "Platforms/Android" ]; then
            export ANDROID_CMD="python3 Platforms/Android"
        elif [ -f "Android/android.py" ]; then
            export ANDROID_CMD="python3 Android/android.py"
        elif [ -d "Android" ]; then
            export ANDROID_CMD="python3 Android"
        else
            echo "❌ Error: Android build scripts nahi milay!"
            exit 1
        fi
        
        echo "✅ Detected Android Build Script Command: $ANDROID_CMD"
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        
        # 🔥 FINAL OPTIMIZATION FLAGS (Yaheen se size 20MB hoga) 🔥
        # -Os : Optimize for Size (Size chota aur fast)
        # -g0 : Debug info bilkul zero kar do (bohat space bachata hai)
        export CFLAGS="-Os -g0"
        
        # -z,max-page-size=16384 : Android 15+ 16KB page size ke liye
        # --strip-all : Linker stage par hi sab kachra saaf kar do
        export LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,--strip-all"
        
        # Faltu libraries ko officially bypass karna jo Android 32-bit mein error deti hain
        export py_cv_module__lzma=n/a
        export py_cv_module__tkinter=n/a
        export py_cv_module__uuid=n/a
        export py_cv_module_nis=n/a
        
        # Step 1 & 2: PC/Host Python Configure and Build
        echo "🔥 Configuring and Building Host Python 🔥"
        $ANDROID_CMD configure-build
        $ANDROID_CMD make-build
        
        # Step 3 & 4: Android 32-bit Configure and Compile
        echo "🔥 Configuring and Compiling Android 32-bit Python 🔥"
        $ANDROID_CMD configure-host arm-linux-androideabi -- CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"
        $ANDROID_CMD make-host arm-linux-androideabi

    - name: 🧹 Clean Heavy Useless Folders (Size Saver)
      run: |
        cd cpython
        echo "✂️ Removing heavy test/ui folders without touching core .py files..."
        
        PREFIX_DIR=$(find cross-build -type d -path "*/arm-linux-androideabi/prefix" | head -n 1)
        
        if[ -n "$PREFIX_DIR" ]; then
          echo "✅ Cleaning up Directory: $PREFIX_DIR"
          
          # Yeh folders 30MB+ space khaate hain aur Android mein inka 0% kaam hai
          rm -rf $PREFIX_DIR/lib/python*/test
          rm -rf $PREFIX_DIR/lib/python*/tkinter
          rm -rf $PREFIX_DIR/lib/python*/idlelib
          rm -rf $PREFIX_DIR/lib/python*/turtledemo
          rm -rf $PREFIX_DIR/lib/python*/pydoc_data
          rm -rf $PREFIX_DIR/lib/python*/ensurepip
          
          # Faltu cache files uda do (core .py files safe rahengi)
          find $PREFIX_DIR -name "__pycache__" -exec rm -rf {} + || true
          echo "✅ Cleanup Done! Size will be around ~20MB now."
        else
          echo "⚠️ Prefix directory not found, skipping manual cleanup."
        fi

    - name: Package 32-bit Embeddable Zip
      run: |
        cd cpython
        
        if [ -d "Platforms/Android" ]; then
            export ANDROID_CMD="python3 Platforms/Android"
        elif [ -f "Android/android.py" ]; then
            export ANDROID_CMD="python3 Android/android.py"
        else
            export ANDROID_CMD="python3 Android"
        fi
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        
        echo "📦 Packaging 32-bit Zip (Official Way) 📦"
        if $ANDROID_CMD package arm-linux-androideabi; then
            echo "✅ Packaged successfully!"
        else
            echo "⚠️ Retrying packaging..."
            $ANDROID_CMD package
        fi

    - name: Upload 32-bit Python Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Official-Python-Android-32bit-20MB
        path: |
          cpython/*.zip
