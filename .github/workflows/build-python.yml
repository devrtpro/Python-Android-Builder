name: Build Official Python for Android
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # 🔥 ERROR FIXED: YAML array format theek kar diya gaya hai
    strategy:
      matrix:
        arch:
          - armeabi-v7a
          - arm64-v8a

    steps:
    - name: Setup System Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential pkg-config curl git unzip

    - name: Checkout Official CPython Source
      run: |
        # Latest Python source code download kar rahe hain (Main branch)
        git clone --depth 1 --branch main https://github.com/python/cpython.git

    - name: Compile Python for ${{ matrix.arch }} (With 16KB Page Size)
      run: |
        cd cpython
        export ANDROID_HOME=$ANDROID_HOME
        
        # 🔥 16KB PAGE SIZE ALIGNMENT FOR ANDROID 15+ 🔥
        export LDFLAGS="-z max-page-size=16384"
        
        echo "🔥 Building Python for ${{ matrix.arch }} 🔥"
        # -- LDFLAGS="..." add kiya hai taake compiler ko 16KB ka pata ho
        python3 Platforms/Android build ${{ matrix.arch }} -- LDFLAGS="$LDFLAGS"

    - name: Package Embeddable Zip
      run: |
        cd cpython
        export ANDROID_HOME=$ANDROID_HOME
        
        echo "📦 Packaging ${{ matrix.arch }} 📦"
        python3 Platforms/Android package ${{ matrix.arch }}

    - name: Upload Python Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Official-Python-Android-${{ matrix.arch }}
        # Yahan main dono cheezein utha raha hoon: Official Zip file aur raw folder
        path: |
          cpython/*.zip
          cpython/cross-build/${{ matrix.arch }}/prefix/
