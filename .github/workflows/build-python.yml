name: Build Python 32-bit ONLY (From Code)
on: [push, workflow_dispatch]

jobs:
  build-32bit:
    runs-on: ubuntu-latest

    steps:
    - name: Setup System Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential pkg-config curl git unzip

    - name: Checkout Official CPython Source Code
      run: |
        # Yahan hum Python ka Original Source Code (.c aur .h files) download kar rahe hain
        git clone --depth 1 --branch main https://github.com/python/cpython.git

    - name: Compile Python ONLY for 32-bit (armeabi-v7a)
      run: |
        cd cpython
        export ANDROID_HOME=$ANDROID_HOME
        
        # 🔥 16KB Page Size Alignment (Android 15+ aur Play Store ke naye rules ke liye) 🔥
        export LDFLAGS="-z max-page-size=16384"
        
        echo "🔥 Compiling Python from Source Code for 32-bit 🔥"
        
        # Yeh command direct C source code ko 32-bit NDK ke zariye compile karegi
        python3 Platforms/Android build armeabi-v7a -- LDFLAGS="$LDFLAGS"

    - name: Package 32-bit Embeddable Zip
      run: |
        cd cpython
        export ANDROID_HOME=$ANDROID_HOME
        
        echo "📦 Packaging 32-bit Zip 📦"
        python3 Platforms/Android package armeabi-v7a

    - name: Upload 32-bit Python Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Official-Python-Android-armeabi-v7a
        path: |
          cpython/*.zip
          cpython/cross-build/armeabi-v7a/prefix/
